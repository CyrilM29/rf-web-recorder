<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 -apple-system, Segoe UI, sans-serif; width: 270px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    button { width: 100%; padding: 8px; margin: 4px 0; font-size: 13px; cursor: pointer;
             border: 1px solid #4f46e5; border-radius: 4px; background: #4f46e5; color: #fff; }
    button.secondary { background: #fff; color: #4f46e5; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; }
    .row button { margin: 4px 0; }
    p { color: #555; margin: 8px 0 0; font-size: 12px; }
    #status { color: #4f46e5; font-size: 12px; margin-top: 8px; min-height: 16px; }
    code { background: #f3f3f3; padding: 0 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <h1>RF Web Recorder</h1>
  <div class="row">
    <button id="capture">Start capture</button>
    <button id="record">Start record</button>
  </div>
  <div class="row">
    <button id="export" class="secondary">Export</button>
    <button id="stop" class="secondary">Stop</button>
  </div>
  <p>Hover highlights; click copies a <code>Get&nbsp;Element</code> line.
     <b>Record</b> turns your interactions into Browser-library steps →
     <b>Export</b> downloads a <code>.robot</code>.
     Shortcut <code>Alt+Shift+U</code> toggles recording. <code>Esc</code> stops.</p>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
